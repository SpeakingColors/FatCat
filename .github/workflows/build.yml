name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxinerama-dev libxext-dev libxrandr-dev libxcursor-dev libxcomposite-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release  2>&1 | tee -a ci.log; exit ${PIPESTATUS[0]}
      - name: Build
        run: cmake --build build --config Release --parallel 4 2>&1 | tee -a ci.log; exit ${PIPESTATUS[0]}
      - name: Validate with pluginval
        continue-on-error: true
        run: |
          set -x
          case "$RUNNER_OS" in
            Linux)   url=pluginval_Linux.zip;   bin=./pluginval ;;
            macOS)   url=pluginval_macOS.zip;   bin=./pluginval.app/Contents/MacOS/pluginval ;;
            Windows) url=pluginval_Windows.zip; bin=./pluginval.exe ;;
          esac
          mkdir -p pv reports && cd pv
          curl -sSL -o pv.zip "https://github.com/Tracktion/pluginval/releases/latest/download/$url" && unzip -q pv.zip
          cd ..
          rc=0
          for p in $(find build -name '*.vst3' -maxdepth 6 | sort -u); do
            "pv/${bin#./}" --strictness-level 5 --skip-gui-tests --output-dir reports --junit-xml "reports/$(basename "$p").xml" "$p" || rc=1
          done
          exit $rc
      - name: Upload pluginval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pluginval-${{ runner.os }}
          path: reports/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: FatCat-${{ runner.os }}
          path: build/*_artefacts/
          if-no-files-found: warn
      - name: Publish log to ci-log branch
        if: always()
        run: |
          mkdir -p /tmp/logpub && cp ci.log /tmp/logpub/${{ runner.os }}.log || true
          tail -n 400 /tmp/logpub/${{ runner.os }}.log > /tmp/logpub/${{ runner.os }}.tail.log || true
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git fetch origin ci-log || true
          git checkout -B ci-log $(git rev-parse --verify -q origin/ci-log || echo HEAD)
          [ -n "$(git rev-parse --verify -q origin/ci-log)" ] || git rm -rf -q . || true
          mkdir -p logs && cp /tmp/logpub/*.tail.log logs/ && git add logs
          git commit -q -m "ci log ${{ runner.os }} $GITHUB_SHA" || true
          git push origin ci-log || true
